version: 2

sources:
  - name: source_a
    description: "Scheduling system landing zone. Populated by section 7 of SDG_DEMO_SETUP.sql."
    database: SDG_BRZ
    schema: SOURCE_A
    tables:
      - name: raw_appointments
        description: "Raw appointment records, untyped as landed."
        loaded_at_field: _loaded_at
        columns:
          - name: patient_id
            tests: [not_null, unique]
          - name: doctor_id
            tests: [not_null]
          - name: status
            tests:
              - accepted_values:
                  values: ['completed', 'cancelled', 'scheduled']

  - name: source_b
    description: "HR / credentialing landing zone. Populated by section 7 of SDG_DEMO_SETUP.sql."
    database: SDG_BRZ
    schema: SOURCE_B
    tables:
      - name: raw_doctors
        description: "Raw provider reference data, untyped as landed."
        loaded_at_field: _loaded_at
        columns:
          - name: doctor_id
            tests: [not_null, unique]
          - name: doctor_name
            tests: [not_null]
