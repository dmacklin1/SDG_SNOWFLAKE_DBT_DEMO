version: 2

models:
  - name: slv_base_appointments
    description: "Cleaned appointment records, one row per source record, surrogate-keyed."
    columns:
      - name: appointment_sk
        tests: [not_null, unique]
      - name: patient_id
        tests: [not_null]

  - name: slv_base_doctors
    description: "Cleaned provider records."
    columns:
      - name: doctor_id
        tests: [not_null, unique]

  - name: slv_doctors
    description: "Conformed provider dimension. The business definition of a doctor."
    columns:
      - name: doctor_id
        tests: [not_null, unique]
      - name: doctor_name
        tests: [not_null]

  - name: slv_appointments
    description: "Conformed appointment fact, enriched with provider attributes. Incremental."
    columns:
      - name: appointment_sk
        tests: [not_null, unique]
      - name: doctor_id
        tests:
          - not_null
          - relationships:
              to: ref('slv_doctors')
              field: doctor_id
      - name: status
        tests:
          - accepted_values:
              values: ['completed', 'cancelled', 'scheduled']
