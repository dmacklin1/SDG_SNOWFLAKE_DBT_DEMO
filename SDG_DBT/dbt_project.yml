name: 'sdg_demo'
version: '1.0.0'
profile: 'sdg_demo'

model-paths:  ["models"]
test-paths:   ["tests"]
macro-paths:  ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# NOTE: no packages.yml by design. dbt deps requires external network access,
# which is not available on Snowflake trial accounts.
#
# No seeds either. The two RAW_ landing tables are declared as sources in
# models/brz/sources.yml and created by section 7 of SDG_DEMO_SETUP.sql.

models:
  sdg_demo:
    brz:
      +materialized: table
      source_a:
        +database: SDG_BRZ
        +schema: SOURCE_A
      source_b:
        +database: SDG_BRZ
        +schema: SOURCE_B
    slv:
      +materialized: table
      base:
        +database: SDG_SLV
        +schema: BASE
      doctors:
        +database: SDG_SLV
        +schema: DOCTORS
      appointments:
        +database: SDG_SLV
        +schema: APPOINTMENTS
    gld:
      +materialized: table
      analytics:
        +database: SDG_GLD
        +schema: ANALYTICS
