name: 'sdg_demo'
version: '1.0.0'
profile: 'sdg_demo'

model-paths:  ["models"]
seed-paths:   ["seeds"]
test-paths:   ["tests"]
macro-paths:  ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# NOTE: no packages.yml by design. dbt deps requires external network access,
# which is not available on Snowflake trial accounts.

seeds:
  sdg_demo:
    +quote_columns: false
    source_a:
      +database: SDG_BRZ
      +schema: SOURCE_A
    source_b:
      +database: SDG_BRZ
      +schema: SOURCE_B

models:
  sdg_demo:
    brz:
      +materialized: view
      source_a:
        +database: SDG_BRZ
        +schema: SOURCE_A
      source_b:
        +database: SDG_BRZ
        +schema: SOURCE_B
    slv:
      +materialized: table
      base:
        +database: SDG_SLV
        +schema: BASE
      doctors:
        +database: SDG_SLV
        +schema: DOCTORS
      appointments:
        +database: SDG_SLV
        +schema: APPOINTMENTS
    gld:
      +materialized: table
      analytics:
        +database: SDG_GLD
        +schema: ANALYTICS
